name: iOS 18 root (Renegade)

# Builds the iOS 18.7.8 (22H352, iPhone11,8) HFS+ root that Heartwood boots from userdata.
# tools/renegade/README.md, "Platforms": on Linux the image is mounted through a loop
# device, so the job runs on ubuntu (passwordless sudo) with apfs-fuse for the IPSW dmgs.

on:
  workflow_dispatch:
    inputs:
      size:
        description: Root image size passed to Renegade
        required: false
        default: "20g"
      jobs:
        description: Parallel copy jobs (empty = nproc)
        required: false
        default: ""
      gpu_firmware_url:
        description: Release tag or directory URL with the GPU firmware (empty = skip)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios18-root-${{ github.ref }}
  cancel-in-progress: false

env:
  RENEGADE_TARGET: ios18

jobs:
  root:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Move Renegade's research dir to the big disk
        run: |
          set -euo pipefail
          df -h / /mnt || true
          sudo mkdir -p /mnt/renegade-research && sudo chown "$USER" /mnt/renegade-research
          rm -rf research && ln -s /mnt/renegade-research research
          # The repository stores the Renegade entry points without the executable bit.
          chmod +x tools/renegade/renegade tools/renegade/*.sh

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 curl hfsprogs util-linux zstd dropbear-bin \
            cmake g++ git libfuse3-dev libbz2-dev zlib1g-dev libattr1-dev fuse3 \
            pkg-config libtool autoconf
          sudo modprobe hfsplus && grep hfsplus /proc/filesystems || true

      - name: Build apfs-fuse (reads the IPSW dmgs)
        run: |
          set -euo pipefail
          git clone -q --recursive https://github.com/sgan81/apfs-fuse /tmp/apfs-fuse
          cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build -DCMAKE_BUILD_TYPE=Release >/tmp/apfs-cmake.log
          make -C /tmp/apfs-fuse/build -j"$(nproc)" >/tmp/apfs-make.log 2>&1 || { tail -40 /tmp/apfs-make.log; exit 1; }
          sudo install /tmp/apfs-fuse/build/apfs-fuse /usr/local/bin/
          command -v apfs-fuse && apfs-fuse --help >/dev/null 2>&1 || true

      - name: Install the ipsw CLI (partial IPSW download + AEA decryption)
        run: |
          set -euo pipefail
          curl -sL https://api.github.com/repos/blacktop/ipsw/releases/latest -o /tmp/ipsw.json
          URL=$(python3 - <<'PY'
          import json
          r = json.load(open('/tmp/ipsw.json'))
          for a in r['assets']:
              n = a['name']
              if n.startswith('ipsw_') and 'linux_x86_64' in n and n.endswith('.deb'):
                  print(a['browser_download_url']); break
          PY
          )
          [ -n "$URL" ] || { echo "no ipsw linux .deb asset"; exit 1; }
          curl -sL --retry 3 "$URL" -o /tmp/ipsw.deb
          sudo apt-get install -y -qq /tmp/ipsw.deb
          command -v ipsw && (ipsw version 2>/dev/null | head -1 || ipsw --version | head -1)

      - name: Fetch the encrypted root and cryptex dmgs
        run: |
          set -euo pipefail
          bash tools/renegade/renegade fetch 2>&1 | tail -30
          du -sh research/* 2>/dev/null | head

      - name: Fetch the prebuilt berga-tools (dropbear/dash/toybox, sweetnet tools)
        run: |
          set -euo pipefail
          sudo -E bash tools/renegade/renegade fetch-tools 2>&1 | tail -20
          sudo ls -l /root/.cache/bergamota/berga-tools/*/ssh 2>/dev/null | head -8 || true

      - name: Build bgmtl-env.dylib (the backboardd Metal gate)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq clang-18 lld-18 llvm-18
          ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          for b in ld64.lld-18 ld64.lld; do [ -e /usr/bin/$b ] && { real=$b; break; }; done
          ln -sf /usr/bin/${real:-ld64.lld} /usr/local/bin/ld64.lld-18
          ln -sf /usr/bin/llvm-nm-18 /usr/local/bin/llvm-nm-18
          ln -sf /usr/bin/llvm-objdump-18 /usr/local/bin/llvm-objdump-18
          export PATH=/usr/local/bin:$PATH
          cd tools/raphael/bgmtl-env && bash build.sh
          ls -l bgmtl-env.dylib

      - name: Build the root image
        run: |
          set -euo pipefail
          JOBS="${{ inputs.jobs }}"
          [ -n "$JOBS" ] || JOBS="$(nproc)"
          # Chlorophyll's prebuilt bgmtl dylibs (Bergamota release bgmtl-20261025): Renegade's bgmtl() installs them
          # into /usr/local/lib/bgmtl and links the Metal device into MercuryPosterExtension, so the wallpaper renders
          # on the Adreno 640 instead of the CPU.
          export RENEGADE_BGMTL_DIR="$PWD/tools/raphael/chlorophyll/prebuilt"
          ls -l "$RENEGADE_BGMTL_DIR"
          # Dropbear key for this project (the public half only): the root image gets it in /var/root/.ssh/authorized_keys.
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          install -m 644 tools/raphael/chlorophyll/prebuilt/id_ed25519.pub "$HOME/.ssh/id_ed25519.pub"
          # Linux builds the image through a loop device and mount(8): run as root.
          sudo -E env RENEGADE_BGMTL_DIR="$RENEGADE_BGMTL_DIR" bash tools/renegade/renegade root --delete-sources --size "${{ inputs.size }}" --jobs "$JOBS" 2>&1 | tail -80
          sudo chown -R "$USER" research
          find -L research -maxdepth 4 -name '*.img' -o -maxdepth 3 -name '*.simg' | while read -r f; do
            ls -l "$f"; sha256sum "$f"
          done

      - name: Inject the GPU firmware into the root
        if: always() && inputs.gpu_firmware_url != ''
        run: |
          set -euo pipefail
          sudo chown -R "$USER" /mnt/renegade-research
          RAW=$(find -L research -name 'root.img' -type f | head -1)
          if [ -z "$RAW" ]; then
            # The simg stage leaves only the Android sparse image; expand it, inject, and let
            # the pack step compress the raw image instead.
            SIMG=$(find -L research -name '*.simg' -type f | head -1)
            [ -n "$SIMG" ] || { echo "no root image in research/"; exit 1; }
            RAW="${SIMG%.simg}.img"
            python3 tools/renegade/simg2img.py "$SIMG" "$RAW"
            rm -f "$SIMG"
          fi
          [ -f "$RAW" ] || { echo "no root.img"; exit 1; }
          mkdir -p /tmp/gpufw
          gh release download "${{ inputs.gpu_firmware_url }}" \
            --repo "${{ github.repository }}" -D /tmp/gpufw --clobber
          ls -l /tmp/gpufw
          MNT=/mnt/renegade-research/gpufw-mnt
          mkdir -p "$MNT"
          sudo modprobe hfsplus
          DEV=$(sudo losetup --find --show "$RAW")
          sudo mount -t hfsplus -o rw,force "$DEV" "$MNT"
          sudo mkdir -p "$MNT/usr/local/share/firmware"
          sudo cp /tmp/gpufw/* "$MNT/usr/local/share/firmware/"
          sudo chown 0:0 "$MNT/usr/local/share/firmware"/*
          sudo chmod 644 "$MNT/usr/local/share/firmware"/*
          ls -l "$MNT/usr/local/share/firmware/"
          sync
          sudo umount "$MNT"
          sudo losetup -d "$DEV"

      - name: Install Chlorophyll's bgmtl into the image
        if: always()
        run: |
          set -euo pipefail
          RAW=$(find -L research -name '*.img' -type f -size +10G | head -1)
          [ -n "$RAW" ] || { echo "no raw root image"; exit 1; }
          sudo mkdir -p /mnt/bgmtl
          sudo modprobe hfsplus
          DEV=$(sudo losetup --find --show "$RAW")
          sudo mount -t hfsplus -o rw,force "$DEV" /mnt/bgmtl
          sudo env RENEGADE_BGMTL_DIR="$PWD/tools/raphael/chlorophyll/prebuilt" python3 - <<'PY'
          import importlib.util, os
          here = os.path.abspath('tools/renegade')
          spec = importlib.util.spec_from_file_location('root_tweaks18', os.path.join(here, 'root_tweaks18.py'))
          rt = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(rt)
          print('bgmtl ->', rt.bgmtl('/mnt/bgmtl'))
          PY
          sync
          sudo umount /mnt/bgmtl
          sudo losetup -d "$DEV"

      - name: Stage Chlorophyll as the system compositor (backboardd)
        if: always()
        run: |
          set -euo pipefail
          RAW=$(find -L research -name '*.img' -type f -size +10G | head -1)
          [ -n "$RAW" ] || { echo "no raw root image"; exit 1; }
          ENV=$PWD/tools/raphael/bgmtl-env/bgmtl-env.dylib
          [ -f "$ENV" ] || { echo "bgmtl-env.dylib not built"; exit 1; }
          sudo mkdir -p /mnt/comp
          sudo modprobe hfsplus
          DEV=$(sudo losetup --find --show "$RAW")
          sudo mount -t hfsplus -o rw,force "$DEV" /mnt/comp
          sudo env RENEGADE_BGMTL_DIR="$PWD/tools/raphael/chlorophyll/prebuilt" python3 \
            tools/raphael/chlorophyll/stage_compositor.py /mnt/comp "$ENV"
          sync
          sudo umount /mnt/comp
          sudo losetup -d "$DEV"

      - name: Verify Chlorophyll, the ssh key and the GPU firmware in the image
        continue-on-error: true
        run: |
          set -uo pipefail
          RAW=$(find -L research -name '*.img' -type f -size +10G | head -1)
          [ -n "$RAW" ] || { echo "no raw image"; exit 0; }
          sudo mkdir -p /mnt/check
          sudo modprobe hfsplus || true
          DEV=$(sudo losetup --find --show "$RAW") || { echo "losetup failed"; exit 0; }
          sudo mount -t hfsplus -o ro,force "$DEV" /mnt/check || { echo "mount failed"; sudo losetup -d "$DEV"; exit 0; }
          echo "== /usr/local/lib/bgmtl"; ls -l /mnt/check/usr/local/lib/bgmtl || true
          M=/mnt/check/System/Library/ExtensionKit/Extensions/MercuryPosterExtension.appex/MercuryPosterExtension
          echo "== MercuryPosterExtension"; [ -f "$M" ] && (strings -a "$M" | grep -o 'bgmtl[^ ]*' | sort -u | head -5) || echo "absent"
          echo "== backboardd"; strings -a /mnt/check/usr/libexec/backboardd | grep -o 'bgmtl[^ ]*' | sort -u | head -5 || true
          echo "== bb arm/off"; ls -l /mnt/check/private/var/tmp/bgmtl-bb.* /mnt/check/private/var/tmp/bgmtl.defer 2>/dev/null || true
          echo "== authorized_keys"; cat /mnt/check/private/var/root/.ssh/authorized_keys 2>/dev/null || true
          echo "== dropbear"; ls -l /mnt/check/usr/local/bin/dropbear /mnt/check/bin/sh 2>/dev/null || true
          echo "== GPU firmware"; ls -l /mnt/check/usr/local/share/firmware/ 2>/dev/null || true
          sudo umount /mnt/check; sudo losetup -d "$DEV"

      - name: Pack and upload the root image
        if: always()
        run: |
          set -euo pipefail
          echo "=== files ==="
          find -L research -maxdepth 5 -type f \( -name '*.img' -o -name '*.simg' \) -exec ls -l {} \; || true
          mkdir -p /tmp/upload
          # A 20 GiB raw image does not fit an artifact: prefer the Android sparse image,
          # otherwise compress the raw one.
          simg=$(find -L research -name '*.simg' -type f | head -1)
          if [ -n "$simg" ]; then
            zstd -q -T0 -6 "$simg" -o /tmp/upload/root.simg.zst
          else
            raw=$(find -L research -name '*.img' -type f | head -1)
            [ -n "$raw" ] || { echo "no root image"; exit 1; }
            zstd -q -T0 -6 "$raw" -o /tmp/upload/root.img.zst
          fi
          ls -l /tmp/upload
          sha256sum /tmp/upload/*

      - name: Upload the root image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios18-root
          path: /tmp/upload/*
          if-no-files-found: warn
          compression-level: 0
